{{- if .Values.shard.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "apexdata-agent.fullname" . }}-shard
  namespace: {{ include "apexdata-agent.namespace" . }}
  labels:
    {{- include "apexdata-agent.shard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "apexdata-agent.shard.selectorLabels" . | nindent 6 }}
  {{- with .Values.shard.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "apexdata-agent.shard.labels" . | nindent 8 }}
      annotations:
        container.apparmor.security.beta.kubernetes.io/shard: unconfined
        {{- with .Values.shard.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "apexdata-agent.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "apexdata-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      containers:
        - name: shard
          image: "{{ .Values.shard.image.repository }}:{{ .Values.shard.image.tag }}"
          imagePullPolicy: {{ .Values.shard.image.pullPolicy }}
          args:
            - --resources=pods
            - --node=$(NODE_NAME)
            {{- range .Values.shard.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            {{- if .Values.otelCollector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: '{{ include "apexdata-agent.fullname" . }}-otel-collector:{{ .Values.otelCollector.service.ports.grpc }}'
            {{- else }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: '{{ include "apexdata-agent.otelEndpoint" . }}'
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: 'Authorization={{ include "apexdata-agent.otelAuthHeader" . }}'
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: 'grpc'
            {{- end }}
            - name: K8S_CLUSTER_NAME
              value: {{ .Values.apexdata.clusterName | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.shard.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f apexdata-agent || exit 1"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f apexdata-agent || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          securityContext:
            {{- toYaml .Values.shard.securityContext | nindent 12 }}
          volumeMounts:
            - name: cgroupfs
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: bpffs
              mountPath: /sys/fs/bpf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      {{- with .Values.shard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: cgroupfs
          hostPath:
            path: /sys/fs/cgroup
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: tmp
          emptyDir: {}
{{- end }}
