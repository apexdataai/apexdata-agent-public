{{- if .Values.shard.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "apexdata-agent.fullname" . }}-shard
  namespace: {{ include "apexdata-agent.namespace" . }}
  labels:
    {{- include "apexdata-agent.shard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "apexdata-agent.shard.selectorLabels" . | nindent 6 }}
  {{- with .Values.shard.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "apexdata-agent.shard.labels" . | nindent 8 }}
      annotations:
        container.apparmor.security.beta.kubernetes.io/shard: unconfined
        {{- with .Values.shard.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "apexdata-agent.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "apexdata-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      {{- if .Values.shard.runtimeClassName }}
      runtimeClassName: {{ .Values.shard.runtimeClassName | quote }}
      {{- end }}
      containers:
        - name: shard
          image: {{ include "apexdata-agent.agentImage" (dict "component" .Values.shard "global" .Values.image) | quote }}
          imagePullPolicy: {{ include "apexdata-agent.agentPullPolicy" (dict "component" .Values.shard "global" .Values.image) }}
          args:
            - --resources=pods
            - --node=$(NODE_NAME)
            {{- if .Values.agent.enabled }}
            # Cluster Events are exported once by the agent Deployment (lease
            # singleton); every node shard exporting them too would duplicate
            # each event N-nodes times.
            - --k8s-event-export-mode=disabled
            {{- else }}
            # No cluster-level agent in this install: keep the pre-singleton
            # direct watch so cluster Events are not silently lost.
            - --k8s-event-export-mode=direct
            {{- end }}
            {{- if .Values.shard.postgresDsn }}
            - --postgres-dsn=$(POSTGRES_DSN)
            {{- end }}
            {{- range .Values.shard.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- if .Values.shard.runtimeClassName }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            {{- if .Values.otelCollector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: '{{ include "apexdata-agent.fullname" . }}-otel-collector:{{ .Values.otelCollector.service.ports.grpc }}'
            {{- else }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_HEADERS
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_PROTOCOL
            {{- end }}
            {{- if .Values.shard.postgresDsn }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-postgres
                  key: POSTGRES_DSN
            {{- end }}
            - name: K8S_CLUSTER_NAME
              value: {{ .Values.apexdata.clusterName | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.shard.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x apexdata-agent || exit 1"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x apexdata-agent || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 18
          securityContext:
            {{- toYaml .Values.shard.securityContext | nindent 12 }}
          volumeMounts:
            - name: cgroupfs
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: bpffs
              mountPath: /sys/fs/bpf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.shard.nvidiaLibsHostPath }}
            - name: nvidia-libs
              mountPath: /host/nvidia-libs
              readOnly: true
            {{- end }}
      {{- with .Values.shard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: cgroupfs
          hostPath:
            path: /sys/fs/cgroup
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: tmp
          emptyDir: {}
        {{- if .Values.shard.nvidiaLibsHostPath }}
        - name: nvidia-libs
          hostPath:
            path: {{ .Values.shard.nvidiaLibsHostPath }}
        {{- end }}
{{- end }}
