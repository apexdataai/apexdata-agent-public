{{- if .Values.agent.enabled }}
# Kubernetes Events are cluster-scoped, so the agent elects a single exporter
# through this namespaced Lease: the cluster-level agent Deployment holds it,
# node shards and the unscheduled-pods watcher stay idle. Without this Role the
# agent falls back to a direct (uncoordinated) watch — events still flow, but
# rollout/failover coordination is lost.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "apexdata-agent.fullname" . }}-k8s-event-exporter
  namespace: {{ include "apexdata-agent.namespace" . }}
  labels:
    {{- include "apexdata-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['create']
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    resourceNames: ['{{ include "apexdata-agent.fullname" . }}-k8s-event-exporter']
    verbs: ['get', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "apexdata-agent.fullname" . }}-k8s-event-exporter
  namespace: {{ include "apexdata-agent.namespace" . }}
  labels:
    {{- include "apexdata-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "apexdata-agent.fullname" . }}-k8s-event-exporter
subjects:
  - kind: ServiceAccount
    name: {{ include "apexdata-agent.serviceAccountName" . }}
    namespace: {{ include "apexdata-agent.namespace" . }}
{{- end }}
