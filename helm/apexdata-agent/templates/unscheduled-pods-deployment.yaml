{{- if .Values.unscheduledPods.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexdata-agent.fullname" . }}-unscheduled-pods
  namespace: {{ include "apexdata-agent.namespace" . }}
  labels:
    {{- include "apexdata-agent.unscheduledPods.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.unscheduledPods.replicas }}
  selector:
    matchLabels:
      {{- include "apexdata-agent.unscheduledPods.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apexdata-agent.unscheduledPods.labels" . | nindent 8 }}
      {{- with .Values.unscheduledPods.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "apexdata-agent.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "apexdata-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      containers:
        - name: unscheduled-pods
          image: {{ include "apexdata-agent.agentImage" (dict "component" .Values.unscheduledPods "global" .Values.image) | quote }}
          imagePullPolicy: {{ include "apexdata-agent.agentPullPolicy" (dict "component" .Values.unscheduledPods "global" .Values.image) }}
          args:
            - --disable-node-collector
            - --resources=pods
            - --track-unscheduled-pods
          env:
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            {{- if .Values.otelCollector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: '{{ include "apexdata-agent.fullname" . }}-otel-collector:{{ .Values.otelCollector.service.ports.grpc }}'
            {{- else }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_HEADERS
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_PROTOCOL
            {{- end }}
            - name: K8S_CLUSTER_NAME
              value: {{ .Values.apexdata.clusterName | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.unscheduledPods.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f apexdata-agent || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f apexdata-agent || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          securityContext:
            {{- toYaml .Values.unscheduledPods.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- with .Values.unscheduledPods.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.unscheduledPods.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.unscheduledPods.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
