{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexdata-agent.fullname" . }}-agent
  namespace: {{ include "apexdata-agent.namespace" . }}
  labels:
    {{- include "apexdata-agent.agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      {{- include "apexdata-agent.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apexdata-agent.agent.labels" . | nindent 8 }}
      {{- with .Values.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "apexdata-agent.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "apexdata-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      containers:
        - name: agent
          image: {{ include "apexdata-agent.agentImage" (dict "component" .Values.agent "global" .Values.image) | quote }}
          imagePullPolicy: {{ include "apexdata-agent.agentPullPolicy" (dict "component" .Values.agent "global" .Values.image) }}
          args:
            - --disable-node-collector
            # Singleton Kubernetes Event exporter: this Deployment coordinates
            # through the Lease from event-exporter-role.yaml; shards stay idle.
            - --k8s-event-export-mode=leader
            - --k8s-event-lease-namespace={{ include "apexdata-agent.namespace" . }}
            - --k8s-event-lease-name={{ include "apexdata-agent.fullname" . }}-k8s-event-exporter
            - --resources={{ .Values.agent.resourcesList }}
          env:
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            # Lease holder identity (downward API): pod name + UID make the
            # holder recognizable in `kubectl get lease` during failover.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            {{- if .Values.otelCollector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: '{{ include "apexdata-agent.fullname" . }}-otel-collector:{{ .Values.otelCollector.service.ports.grpc }}'
            {{- else }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_HEADERS
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: {{ include "apexdata-agent.fullname" . }}-otlp-credentials
                  key: OTEL_EXPORTER_OTLP_PROTOCOL
            {{- end }}
            - name: K8S_CLUSTER_NAME
              value: {{ .Values.apexdata.clusterName | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x apexdata-agent || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x apexdata-agent || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 12
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
