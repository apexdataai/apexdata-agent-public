{{- if and .Values.shard.enabled .Values.shard.postgresDsn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apexdata-agent.fullname" . }}-postgres
  namespace: {{ include "apexdata-agent.namespace" . }}
  labels:
    {{- include "apexdata-agent.shard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.shard.postgresDsn | quote }}
{{- end }}
