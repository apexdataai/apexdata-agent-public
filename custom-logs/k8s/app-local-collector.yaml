# App sending logs to the shared in-cluster OTel Collector (no auth, no TLS).
# Deploy the agent Helm chart with otelCollector.enabled=true first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-logs-demo
  namespace: apexdata-ai
  labels:
    app: custom-logs-demo
    app.kubernetes.io/part-of: apexdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-logs-demo
  template:
    metadata:
      labels:
        app: custom-logs-demo
        app.kubernetes.io/part-of: apexdata
    spec:
      containers:
        - name: app
          image: YOUR_REGISTRY/custom-logs:latest
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "apexdata-apexdata-agent-otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "my-app"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
